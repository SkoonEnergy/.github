name: Feature
description: Propose a new capability or improvement.
title: "[Feature]: "
type: Feature
projects: ["SkoonEnergy/3"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an improvement.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem should this feature solve, and for whom?
      placeholder: Describe the current situation and why it needs to improve.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or outcome you would like.
      placeholder: As a ..., I want ..., so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the conditions that must be met for this feature to be complete.
      placeholder: |
        - [ ] Criterion one
        - [ ] Criterion two
    validations:
      required: true
