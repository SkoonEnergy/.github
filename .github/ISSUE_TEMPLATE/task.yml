name: Task
description: Create a focused piece of work.
title: "[Task]:"
type: Task
projects: ["SkoonEnergy/3"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the work clearly enough that someone can pick it up.
  - type: textarea
    id: task-description
    attributes:
      label: Task description
      description: What needs to be done and why?
      placeholder: Describe the work, context, and intended outcome.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the conditions that must be met for this task to be complete.
      placeholder: |
        - [ ] Criterion one
        - [ ] Criterion two
    validations:
      required: true
