name: Epic
description: Define a large initiative that contains related work.
title: "[Epic]:"
type: Epic
projects: ["SkoonEnergy/3"]
body:
  - type: markdown
    attributes:
      value: |
        Use an epic to describe a larger initiative and its intended outcome.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What goal should this epic achieve?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Scope or context
      description: Add scope, success criteria, related work, or any useful details.
    validations:
      required: false
