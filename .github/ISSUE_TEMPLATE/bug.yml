name: Bug
description: Report an unexpected problem or behavior.
title: "[Bug]: "
type: Bug
projects: ["SkoonEnergy/3"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Briefly describe the unexpected behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Reproduction or context
      description: Add steps, environment details, screenshots, logs, or anything else that may help.
    validations:
      required: false
